<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Save & Cook BC</title><style> *{box-sizing:border-box}body{margin:0;background:#f5f7f1;color:#173e30;font:16px system-ui}header{background:#174e39;color:white;padding:28px max(20px,calc((100% - 1000px)/2))}h1{margin:0;font-size:32px}main{max-width:1000px;margin:auto;padding:20px}button,input,select{font:inherit;padding:11px;border:1px solid #ccd8ce;border-radius:9px}button{cursor:pointer;background:#e2eee0;color:#174e39}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}input{width:100%;margin:12px 0}article{background:white;border:1px solid #dce5db;border-radius:14px;padding:18px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.price{font-size:28px;font-weight:bold;color:#207043}small{color:#53685b}header button{float:right}p{line-height:1.5}footer{padding:20px;text-align:center}</style><header><button id="lang">繁體中文</button><h1>Save & Cook BC</h1><p id="tag"></p></header><main><small id="notice"></small><nav id="nav"></nav><section id="content"></section></main><footer>Save & Cook BC · 1.0</footer><script>
const data=[['Chicken thighs','雞腿肉','T&T',2.49,4.49,'lb','🍗'],['Chicken thighs','雞腿肉','Superstore',3.49,4.49,'lb','🍗'],['Salmon','鮭魚','Save-On-Foods',8.99,13.99,'lb','🐟'],['Salmon','鮭魚','T&T',9.99,13.99,'lb','🐟'],['Eggs','雞蛋','No Frills',3.49,4.99,'12 pack','🥚'],['Eggs','雞蛋','Walmart',3.97,4.99,'12 pack','🥚'],['Broccoli','西蘭花','Walmart',1.49,2.49,'lb','🥦'],['Broccoli','西蘭花','T&T',1.99,2.99,'lb','🥦'],['Ground beef','牛絞肉','Superstore',4.99,7.49,'lb','🥩']];let zh=false,tab=0,cart={};try{cart=JSON.parse(localStorage.getItem('sc-cart')||'{}')}catch{}const t=(a,b)=>zh?b:a, money=n=>'$'+n.toFixed(2), name=d=>d[zh?1:0], el=id=>document.getElementById(id);function add(i,n){cart[i]=Math.max(0,(cart[i]||0)+n);try{localStorage.setItem('sc-cart',JSON.stringify(cart))}catch{}render()}function render(){document.documentElement.lang=zh?'zh-Hant':'en';el('lang').textContent=t('繁體中文','English');el('tag').textContent=t('Shop smarter. Cook better. Spend less.','聰明購物・輕鬆煮飯・天天省錢');el('notice').textContent=t('Greater Vancouver • Demo prices only — not live flyers.','大溫哥華・示範價格，非即時傳單。');el('nav').innerHTML=[t('Weekly deals','本週特價'),t('Compare prices','超市比價'),t('Cooking ideas','料理推薦'),t('Shopping list','購物清單')].map((x,i)=>`<button onclick="tab=${i};render()">${x}</button>`).join('');let c=el('content');if(tab===0){c.innerHTML=`<h2>${t('Top promotions','精選優惠')}</h2><input id="search" placeholder="${t('Search groceries or stores','搜尋食材或超市')}"><div class="grid" id="items"></div>`;el('search').oninput=deals;deals()}if(tab===1){c.innerHTML='<h2>'+t('Compare identical sale units','相同單位價格比較')+'</h2><div class="grid">'+[...new Set(data.map(d=>d[0]))].map(n=>{let rows=data.filter(d=>d[0]===n).sort((a,b)=>a[3]-b[3]);return `<article><h3>${name(rows[0])}</h3>${rows.map((d,i)=>`<p>${d[2]} — <b>${money(d[3])}/${d[5]}</b> ${i===0?t('Lowest listed','最低列出價'):''}</p>`).join('')}</article>`}).join('')+'</div>'}if(tab===2){c.innerHTML='<h2>'+t('Cooking ideas from sample deals','特價食材料理推薦')+'</h2><p>'+t('Curated recipes, not live AI generation.','精選食譜，非即時 AI 生成。')+'</p><div class="grid">'+[[t('Ginger soy chicken','薑汁醬油雞'),t('Season chicken with ginger and soy sauce. Pan-fry and cook through to 74°C. Serve with rice.','雞肉以薑及醬油調味，煎熟至中心溫度74°C，配白飯。')],[t('Salmon and broccoli','鮭魚西蘭花'),t('Roast seasoned salmon until 70°C. Steam broccoli and serve with rice.','鮭魚調味後烤至70°C，配蒸西蘭花及白飯。')],[t('Beef broccoli stir-fry','西蘭花炒牛肉'),t('Cook ground beef to 71°C with garlic. Add broccoli and soy sauce.','牛絞肉加蒜炒至71°C，加入西蘭花及醬油。')]].map(r=>`<article><h3>${r[0]}</h3><p>${r[1]}</p></article>`).join('')+'</div>'}if(tab===3){let ids=Object.keys(cart).filter(i=>cart[i]>0);c.innerHTML='<h2>'+t('Shopping list','購物清單')+'</h2>'+ids.map(i=>`<article>${name(data[i])} · ${data[i][2]}<p>${cart[i]} × ${data[i][5]} — ${money(cart[i]*data[i][3])}</p><button onclick="add(${i},-1)">−</button> <button onclick="add(${i},1)">+</button></article>`).join('')+`<h2>${t('Estimated total','預估總額')}: ${money(ids.reduce((s,i)=>s+cart[i]*data[i][3],0))}</h2><small>${t('Before taxes and fees','未含稅及其他費用')}</small>`}}function deals(){let q=el('search').value.toLowerCase();el('items').innerHTML=data.map((d,i)=>({d,i})).filter(({d})=>d.join(' ').toLowerCase().includes(q)).sort((a,b)=>a.d[3]/a.d[4]-b.d[3]/b.d[4]).map(({d,i})=>`<article><div style="font-size:40px">${d[6]}</div><h3>${name(d)}</h3><small>${d[2]} · ${t('Save','省')} ${Math.round(100*(1-d[3]/d[4]))}%</small><div class="price">${money(d[3])}<small>/${d[5]}</small></div><p><button onclick="add(${i},1)">${t('+ Shopping list','＋加入清單')}</button></p></article>`).join('')}el('lang').onclick=()=>{zh=!zh;render()};render();</script></html>
